{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
  <div class="flex flex-col items-center justify-center py-20">
    <div class="max-w-md w-full space-y-6 text-center">
      <h1 class="text-6xl font-extralight tracking-tighter text-sonata-pearl">
        404
      </h1>
      <div class="space-y-2">
        <h2 class="text-xl font-light tracking-tight text-sonata-pearl">
          Page Not Found
        </h2>
        <p class="text-sm text-sonata-slate font-light">
          The page you are looking for does not exist.
        </p>
      </div>
      <div class="pt-8">
        <a href="/" class="sonata-btn"> Go Back Home </a>
      </div>
    </div>
  </div>
{% endblock %}
