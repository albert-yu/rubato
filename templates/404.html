{% extends "base.html" %}

        <div>
            <h2 class="mt-6 text-center text-4xl font-serif font-bold text-black">
                404 - Page Not Found
            </h2>
            <p class="mt-4 text-center text-sm font-mono text-gray-500">

        </div>
        <div class="mt-8">
