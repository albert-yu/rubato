{% extends "../base.html" %}

{% block nav %}

        </div>
        <ul class="space-y-1 flex-1">

                    <span>←</span> Back to Archive

            <li>
                <a href="/admin/musicians" class="block px-4 py-2.5 rounded-lg transition-all text-sm {% if active_nav == "musicians" %}bg-atelier-ink text-white font-bold shadow-md{% else %}text-atelier-muted hover:text-atelier-ink hover:bg-atelier-bg{% endif %}">Musicians</a>
