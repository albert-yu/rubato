{% extends "../base.html" %}

{% block nav %}
    {% if current_user.is_some() %}
    <nav class="w-64 bg-nocturne-panel border-r border-white/5 flex flex-col p-6">
        <div class="mb-10 flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-nocturne-gold flex items-center justify-center">

            </div>
            <h1 class="text-xl font-serif font-bold text-gray-100 tracking-wide">Admin</h1>
        </div>
        <ul class="space-y-1 flex-1">
            <li>
                <a href="/" class="flex items-center gap-3 px-4 py-3 text-nocturne-gold/70 hover:text-nocturne-gold hover:bg-white/5 rounded-lg transition-all text-sm font-medium">
                    <span>←</span> Back to Archive
                </a>
            </li>
            <li class="pt-6 pb-2">
                <span class="px-4 text-[10px] font-bold text-nocturne-muted uppercase tracking-[0.2em] opacity-50">Management</span>
            </li>
            <li>
                <a href="/admin/musicians" class="block px-4 py-2.5 rounded-lg transition-all text-sm {% if active_nav == "musicians" %}bg-nocturne-gold text-nocturne-bg font-bold shadow-lg shadow-nocturne-gold/10{% else %}text-nocturne-muted hover:text-white hover:bg-white/5{% endif %}">Musicians</a>
            </li>
            <li>
                <a href="/admin/compositions" class="block px-4 py-2.5 rounded-lg transition-all text-sm {% if active_nav == "compositions" %}bg-nocturne-gold text-nocturne-bg font-bold shadow-lg shadow-nocturne-gold/10{% else %}text-nocturne-muted hover:text-white hover:bg-white/5{% endif %}">Compositions</a>

            <li>

            </li>
        </ul>
        <div class="mt-auto pt-6 border-t border-white/5">
             <form action="/logout" method="post">
                <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:text-red-300 hover:bg-red-900/20 rounded-lg transition-colors">Logout</button>
            </form>
