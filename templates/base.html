<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}rubato.club{% endblock %}</title>
    <link href="/assets/main.css" rel="stylesheet" />
    <script src="/assets/vendor/htmx.js"></script>
  </head>
  <body
    class="bg-sonata-black text-sonata-pearl font-sans min-h-[100dvh] {% block body_class %}
    {% endblock %}"
  >
    <div class="flex min-h-[100dvh] flex-col md:flex-row relative">
      <!-- Mobile Header -->
      <header
        class="md:hidden h-16 border-b border-sonata-border flex items-center justify-between px-4 bg-sonata-black flex-shrink-0 z-40 sticky top-0"
      >
        <button
          onclick="toggleNav()"
          class="text-sonata-slate hover:text-sonata-pearl transition-colors p-2"
        >
          <div class="w-6 h-6 stroke-[1.5]">{% include "icons/menu.svg" %}</div>
        </button>
        <span class="text-xl font-light tracking-tighter text-sonata-pearl"
          >rubato<span class="text-sonata-slate">.club</span></span
        >
        <div class="w-10"></div>
        <!-- Spacer to help center the logo if desired, or just keep it balanced -->
      </header>

      <!-- Backdrop -->
      <div
        id="nav-backdrop"
        onclick="toggleNav()"
        class="fixed inset-0 bg-black/80 z-40 hidden transition-opacity md:hidden glass-backdrop"
      ></div>

      {% block nav %}{% endblock %}

      <main class="flex-1 flex flex-col min-w-0 relative">
        <div
          class="flex-1 container mx-auto p-4 md:p-8"
          hx-history-elt
          id="main-content"
        >
          {% block content %}{% endblock %}
        </div>

        <div id="player-container" class="sticky bottom-0 z-40"></div>
      </main>
    </div>

    <script>
      function toggleNav() {
        const nav = document.getElementById("main-nav");
        const backdrop = document.getElementById("nav-backdrop");
        if (nav && backdrop) {
          nav.classList.toggle("-translate-x-full");
          backdrop.classList.toggle("hidden");
        }
      }
    </script>
  </body>
</html>
