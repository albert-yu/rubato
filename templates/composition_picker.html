<div id="composition-picker" class="relative">
    <label for="composition_search" class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2">Composition</label>
    <input type="hidden" name="composition_id" required>

    <div id="search_container">
        <div class="relative">
            <input type="text" 
                   id="composition_search" 
                   name="q"
                   required
                   class="peer block w-full bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light" 
                   placeholder="Search repertoire..."
                   autocomplete="off"
                   hx-get="/search/compositions" 
                   hx-trigger="keyup changed delay:200ms" 
                   hx-target="#search_results"
                   hx-indicator="#search-skeleton"
                   hx-on:input="if(this.value.length === 0) document.getElementById('search_results').innerHTML = ''">
            
            <div id="search-skeleton" class="htmx-indicator absolute z-20 w-full bg-sonata-charcoal shadow-2xl rounded-sm mt-1 border border-sonata-border overflow-hidden">
                <div class="animate-pulse p-4 space-y-4">
                    <div class="flex flex-col space-y-2">
                        <div class="h-3 bg-sonata-border rounded w-3/4"></div>
                        <div class="h-2 bg-sonata-black rounded w-1/2"></div>
                    </div>
                    <div class="flex flex-col space-y-2">
                        <div class="h-3 bg-sonata-border rounded w-2/3"></div>
                        <div class="h-2 bg-sonata-black rounded w-1/3"></div>
                    </div>
                </div>
            </div>
            <div id="search_results" class="peer-placeholder-shown:hidden absolute z-10 w-full bg-sonata-charcoal shadow-2xl rounded-sm mt-1 max-h-60 overflow-auto empty:hidden border border-sonata-border">
            </div>
        </div>
    </div>
</div>
