<div id="composition-picker" class="relative">
    <label for="composition_search" class="block text-sm font-medium text-atelier-muted mb-2 uppercase tracking-widest">Composition <span class="text-atelier-ink">*</span></label>
    <input type="hidden" name="composition_id" required>

    <div id="search_container">
        <div class="relative">
            <input type="text" 
                   id="composition_search" 
                   name="q"
                   required
                   class="peer mt-1 block w-full bg-white border-atelier-border rounded-lg shadow-sm py-3 px-4 focus:outline-none focus:ring-1 focus:ring-atelier-ink focus:border-atelier-ink text-atelier-text placeholder:text-atelier-muted/50 transition-all" 
                   placeholder="Search for a composition..."
                   autocomplete="off"
                   hx-get="/search/compositions" 
                   hx-trigger="keyup changed delay:200ms" 
                   hx-target="#search_results"
                   hx-indicator="#search-skeleton"
                   hx-on:input="if(this.value.length === 0) document.getElementById('search_results').innerHTML = ''">
            
            <div id="search-skeleton" class="htmx-indicator absolute z-20 w-full bg-atelier-panel shadow-lg rounded-lg mt-2 border border-atelier-border overflow-hidden">
                <div class="animate-pulse p-4 space-y-4">
                    <div class="flex flex-col space-y-2">
                        <div class="h-4 bg-atelier-bg rounded w-3/4"></div>
                        <div class="h-3 bg-atelier-bg rounded w-1/2"></div>
                    </div>
                    <div class="flex flex-col space-y-2">
                        <div class="h-4 bg-atelier-bg rounded w-2/3"></div>
                        <div class="h-3 bg-atelier-bg rounded w-1/3"></div>
                    </div>
                </div>
            </div>
            <div id="search_results" class="peer-placeholder-shown:hidden absolute z-10 w-full bg-atelier-panel shadow-lg rounded-lg mt-2 max-h-60 overflow-auto empty:hidden border border-atelier-border">
            </div>
        </div>
    </div>
</div>
