<div id="composition-picker" class="relative">
    <label for="composition_search" class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider mb-2">Composition <span class="text-black">*</span></label>
    <input type="hidden" name="composition_id" required>

    <div id="search_container">
        <div class="relative">
            <input type="text" 
                   id="composition_search" 
                   name="q"
                   required
                   class="peer mt-1 block w-full border border-gray-300 rounded-none shadow-sm py-2 px-3 focus:outline-none focus:ring-black focus:border-black sm:text-sm transition-colors" 
                   placeholder="Search for a composition..."
                   autocomplete="off"
                   hx-get="/search/compositions" 
                   hx-trigger="keyup changed delay:200ms" 
                   hx-target="#search_results"
                   hx-indicator="#search-skeleton"
                   hx-on:input="if(this.value.length === 0) document.getElementById('search_results').innerHTML = ''">
            
            <div id="search-skeleton" class="htmx-indicator absolute z-20 w-full bg-white shadow-none rounded-none mt-1 border border-gray-200 overflow-hidden">
                <div class="animate-pulse p-4 space-y-4">
                    <div class="flex flex-col space-y-2">
                        <div class="h-4 bg-gray-100 w-3/4"></div>
                        <div class="h-3 bg-gray-50 w-1/2"></div>
                    </div>
                    <div class="flex flex-col space-y-2">
                        <div class="h-4 bg-gray-100 w-2/3"></div>
                        <div class="h-3 bg-gray-50 w-1/3"></div>
                    </div>
                </div>
            </div>
            <div id="search_results" class="peer-placeholder-shown:hidden absolute z-10 w-full bg-white shadow-lg rounded-none mt-1 max-h-60 overflow-auto empty:hidden border border-gray-200 text-sm">
            </div>
        </div>
    </div>
</div>
