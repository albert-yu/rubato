<div id="composition-picker" class="relative">
    <label class="block text-sm font-medium text-gray-700">Composition</label>
    <input type="hidden" name="composition_id" required>

    <div id="search_container">
        <div class="relative">
            <input type="text" 
                   id="composition_search" 
                   name="q"
                   class="peer mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" 
                   placeholder="Search for a composition..."
                   autocomplete="off"
                   hx-get="/search/compositions" 
                   hx-trigger="keyup changed delay:200ms" 
                   hx-target="#search_results"
                   hx-indicator="#search-spinner"
                   hx-on:input="if(this.value.length === 0) document.getElementById('search_results').innerHTML = ''">
            <div id="search-spinner" class="htmx-indicator absolute right-3 top-1/2 -translate-y-1/2">
                <svg class="animate-spin h-5 w-5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
            <div id="search_results" class="peer-placeholder-shown:hidden absolute z-10 w-full bg-white shadow-lg rounded-md mt-1 max-h-60 overflow-auto empty:hidden border border-gray-200">
            </div>
        </div>
    </div>
</div>
