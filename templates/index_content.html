<title>Home{% if page > 1 %}- Page {{ page }}{% endif %} | rubato.club</title>
<div class="max-w-6xl mx-auto">
  <div
    class="flex justify-between items-end mb-12 border-b border-sonata-border pb-6"
  >
    <h2 class="text-xs tracking-[0.3em] uppercase font-light text-sonata-slate">
      Recent Recordings
    </h2>
    {% if let Some(user) = current_user %}
      <a
        href="/upload"
        hx-boost="true"
        hx-target="#main-content"
        class="sonata-btn !px-6 !py-2 text-[10px]"
      >
        Upload
      </a>
    {% endif %}
  </div>

  {% if recordings.is_empty() %}
    <div class="text-center text-sonata-slate font-light py-20">
      No recordings yet.
    </div>
  {% else %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      {% for recording in recordings %}
        {% include "recording_card.html" %}
      {% endfor %}
    </div>
    {% include "pagination.html" %}
  {% endif %}
</div>
