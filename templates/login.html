{% extends "base.html" %}

{% block nav %}
    {% include "nav.html" %}
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-atelier-panel border border-atelier-border shadow-lg rounded-xl p-8">
        <h1 class="text-3xl font-serif font-bold text-atelier-ink mb-8 text-center">Sign <span class="text-atelier-muted italic">In</span></h1>
        {% if let Some(error) = error %}
            <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-6 text-sm">
                {{ error }}
            </div>
        {% endif %}
        <form action="/login" method="post" class="space-y-6">
            <div>
                <label for="identity" class="block text-xs font-medium text-atelier-muted uppercase tracking-widest mb-2">Email or Username</label>
                <input type="text" name="identity" id="identity" required autocomplete="username" class="mt-1 block w-full bg-white border-atelier-border rounded-lg shadow-sm py-2.5 px-4 focus:outline-none focus:ring-1 focus:ring-atelier-ink focus:border-atelier-ink text-atelier-text transition-all">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-atelier-muted uppercase tracking-widest mb-2">Password</label>
                <input type="password" name="password" id="password" required autocomplete="current-password" class="mt-1 block w-full bg-white border-atelier-border rounded-lg shadow-sm py-2.5 px-4 focus:outline-none focus:ring-1 focus:ring-atelier-ink focus:border-atelier-ink text-atelier-text transition-all">
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full flex justify-center py-3 px-4 bg-atelier-ink hover:bg-atelier-ink-light text-white font-bold rounded-lg shadow-md transition-all text-sm uppercase tracking-widest">
                    Enter the Archive
                </button>
            </div>
        </form>
        <div class="mt-8 text-center pt-6 border-t border-atelier-border">
            <p class="text-sm text-atelier-muted">
                New here? <a href="/signup" class="font-medium text-atelier-ink hover:text-atelier-ink-light underline underline-offset-4">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
