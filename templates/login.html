{% extends "base.html" %}

{% block title %}Login | rubato.club{% endblock %}

{% block nav %}
  {% include "nav.html" %}
{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto mt-8 md:mt-24">
    <div class="text-center mb-12">
      <h1 class="text-3xl font-light tracking-tighter text-sonata-pearl mb-2">
        Sign In
      </h1>
      <div class="w-12 h-[1px] bg-sonata-charcoal mx-auto"></div>
    </div>
    {% if let Some(error) = error %}
      <div
        class="bg-red-900/20 border border-red-900/50 text-red-400 px-4 py-3 rounded mb-6 text-xs tracking-wide"
      >
        {{ error }}
      </div>
    {% endif %}
    <form action="/login" method="post" class="space-y-6">
      <div>
        <label
          for="identity"
          class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2"
          >Email or Username</label
        >
        <input
          type="text"
          name="identity"
          id="identity"
          required
          autocomplete="username"
          class="block w-full bg-sonata-black border border-sonata-charcoal rounded py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light"
        />
      </div>
      <div>
        <label
          for="password"
          class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2"
          >Password</label
        >
        <input
          type="password"
          name="password"
          id="password"
          required
          autocomplete="current-password"
          class="block w-full bg-sonata-black border border-sonata-charcoal rounded py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light"
        />
      </div>
      <div class="pt-4">
        <button type="submit" class="sonata-btn w-full">Enter</button>
      </div>
    </form>
    <div class="mt-12 text-center">
      <p class="text-xs tracking-widest font-light text-sonata-slate uppercase">
        New here?
        <a
          href="/signup"
          class="text-sonata-pearl hover:underline transition-all"
          >Create Account</a
        >
      </p>
    </div>
  </div>
{% endblock %}
