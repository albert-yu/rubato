{% if let Some(user) = current_user %}
<nav hx-boost="true" class="w-64 bg-white shadow-md flex flex-col p-4">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-indigo-600">Rubato</h1>
    </div>
    
    <div class="mb-6">
        <a href="/upload" class="flex items-center justify-center w-full px-4 py-2 text-white bg-indigo-600 hover:bg-indigo-700 rounded-md font-medium transition-colors shadow-sm">
            Upload
        </a>
    </div>

    <ul class="space-y-2 flex-1">
        <li>
            <a href="/" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">Home</a>
        </li>
        {% if user.is_privileged() %}
        <li>
            <a href="/admin" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">Admin</a>
        </li>
        {% endif %}
        <li>
            <a href="/settings" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">Settings</a>
        </li>
    </ul>
    <div class="mt-auto">
        <form action="/logout" method="post">
            <button type="submit" class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 rounded">Logout</button>
        </form>
    </div>
</nav>
{% endif %}
