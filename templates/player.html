<div class="bg-sonata-charcoal border-t border-sonata-border p-4 lg:p-6 flex flex-col lg:flex-row items-center justify-between shadow-2xl">
    <style>
        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #e8e8e8;
            margin-top: -5px;
            cursor: pointer;
            box-shadow: 0 0 0 0 rgba(232, 232, 232, 0);
            transition: box-shadow 0.2s ease;
        }

        input[type=range]:hover::-webkit-slider-thumb {
            box-shadow: 0 0 0 4px rgba(232, 232, 232, 0.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: transparent;
            border-radius: 1px;
        }

        /* Firefox */
        input[type=range]::-moz-range-thumb {
            height: 12px;
            width: 12px;
            border: none;
            border-radius: 50%;
            background: #e8e8e8;
            cursor: pointer;
            box-shadow: 0 0 0 0 rgba(232, 232, 232, 0);
            transition: box-shadow 0.2s ease;
        }
        input[type=range]:hover::-moz-range-thumb {
            box-shadow: 0 0 0 4px rgba(232, 232, 232, 0.1);
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: transparent;
            border-radius: 1px;
        }
    </style>

    <div class="w-full lg:w-auto flex justify-between lg:justify-start items-center mb-4 lg:mb-0 lg:space-x-6 lg:min-w-[200px]">
        <div class="flex items-center space-x-6 overflow-hidden">
            <!-- Waveform Visualizer -->
            <div class="text-sonata-slate flex-shrink-0 w-10 h-10 flex items-center justify-center">
                 <canvas id="waveform-canvas" width="64" height="64" class="w-full h-full opacity-80"></canvas>
            </div>
            <div class="overflow-hidden">
                <h3 class="text-sm font-light tracking-wide text-sonata-pearl line-clamp-1">{{ recording.composition_title }}</h3>
                <p class="text-[10px] uppercase tracking-widest text-sonata-slate mt-1 line-clamp-1">
                    {% if let Some(title) = recording.movement_title %}
                        {{ title }} — 
                    {% endif %}
                    <a href="/{{ recording.artist_handle }}" hx-boost="true" hx-target="#main-content" class="hover:text-sonata-pearl transition-colors">{{ recording.artist_handle }}</a>
                </p>
            </div>
        </div>
        
        <!-- Mobile Close Button -->
        <button onclick="document.getElementById('player-container').innerHTML=''" class="lg:hidden text-sonata-slate hover:text-sonata-pearl transition-colors ml-4 flex-shrink-0">
            <div class="w-5 h-5 stroke-1">{% include "icons/close.svg" %}</div>
        </button>
    </div>
    
    <div class="w-full lg:flex-1 lg:max-w-3xl lg:mx-8 flex flex-col justify-center">
        <!-- Add crossOrigin attribute to allow Web Audio API access -->
        <audio id="audio-player" src="/audio/{{ recording.file_key }}" type="{{ recording.mime_type }}" autoplay crossorigin="anonymous"></audio>
        
        <div class="flex items-center gap-4 lg:gap-8">
            <!-- Play/Pause -->
            <button id="play-pause-btn" class="text-sonata-pearl hover:text-white transition-colors focus:outline-none flex-shrink-0">
                <div id="icon-play" class="w-10 h-10 hidden">{% include "icons/play.svg" %}</div>
                <div id="icon-pause" class="w-10 h-10">{% include "icons/pause.svg" %}</div>
            </button>

            <!-- Time & Progress -->
            <div class="flex-1 flex items-center gap-3 min-w-0">
                <span id="current-time" class="text-[10px] lg:text-xs text-sonata-slate font-mono w-8 lg:w-10 text-right flex-shrink-0">0:00</span>
                
                <div class="relative flex-1 h-8 flex items-center group">
                     <input type="range" id="seek-slider" class="w-full h-[2px] bg-sonata-border appearance-none focus:outline-none z-10 cursor-pointer" style="background-image: linear-gradient(#e8e8e8, #e8e8e8); background-size: 0% 100%; background-repeat: no-repeat;" min="0" value="0" step="0.1">
                </div>

                <span id="duration" class="text-[10px] lg:text-xs text-sonata-slate font-mono w-8 lg:w-10 flex-shrink-0">--:--</span>
            </div>

            <!-- Volume (Desktop) -->
            <div class="hidden sm:flex items-center gap-2 group flex-shrink-0">
                 <button id="mute-btn" class="text-sonata-slate hover:text-sonata-pearl transition-colors">
                    <div class="w-5 h-5">{% include "icons/volume.svg" %}</div>
                 </button>
                 <div class="w-16 lg:w-20 flex items-center h-8">
                     <input type="range" id="volume-slider" class="w-full h-[2px] bg-sonata-border appearance-none focus:outline-none cursor-pointer" style="background-image: linear-gradient(#e8e8e8, #e8e8e8); background-size: 100% 100%; background-repeat: no-repeat;" min="0" max="1" step="0.05" value="1">
                 </div>
            </div>
        </div>
    </div>
    
    <!-- Desktop Close Button -->
    <div class="hidden lg:block">
        <button onclick="document.getElementById('player-container').innerHTML=''" class="text-sonata-slate hover:text-sonata-pearl transition-colors">
            <div class="w-5 h-5 stroke-1">{% include "icons/close.svg" %}</div>
        </button>
    </div>

    <script>
        (function() {
            const audio = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const seekSlider = document.getElementById('seek-slider');
            const volumeSlider = document.getElementById('volume-slider');
            const currentTimeElem = document.getElementById('current-time');
            const durationElem = document.getElementById('duration');
            const muteBtn = document.getElementById('mute-btn');
            const canvas = document.getElementById('waveform-canvas');
            const canvasCtx = canvas.getContext('2d');
            
            let isSeeking = false;
            let lastVolume = 1;

            // Audio Context Variables
            let audioCtx;
            let analyser;
            let source;
            let animationId;

            // Initialize Audio Context (must be called after user interaction or if autoplay works)
            function initAudioContext() {
                if (audioCtx) return;

                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                
                // Connect audio element to context
                // Note: This can sometimes fail if CORS is not set correctly on the server/tag
                try {
                    source = audioCtx.createMediaElementSource(audio);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    
                    // Setup analyser
                    analyser.fftSize = 256; // Larger size for better low/high freq resolution
                    visualize();
                } catch (e) {
                    console.error("Web Audio API Error:", e);
                }
            }

            function visualize() {
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                const draw = () => {
                    animationId = requestAnimationFrame(draw);
                    
                    analyser.getByteFrequencyData(dataArray);

                    canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                    // Styling matches 'sonata-slate' #666666
                    canvasCtx.fillStyle = '#666666'; 

                    // Draw 4-5 bars centered
                    const barCount = 5;
                    const spacing = 4;
                    const totalWidth = canvas.width;
                    const barWidth = (totalWidth - (spacing * (barCount - 1))) / barCount;
                    
                    // Low to High frequency mapping (indices based on fftSize=256)
                    // Bins: Bass(~1), LowMid(~3), Mid(~8), HighMid(~20), High(~50)
                    const relevantIndices = [1, 3, 8, 20, 50]; 

                    for (let i = 0; i < barCount; i++) {
                        const value = dataArray[relevantIndices[i]] || 0;
                        const percent = value / 255;
                        
                        // Scale height based on value, removed artificial shape
                        const height = Math.max(percent * canvas.height, 6); // Min height 6px
                        
                        const x = i * (barWidth + spacing);
                        const y = (canvas.height - height) / 2; // Center vertically

                        // Rounded bars
                        roundRect(canvasCtx, x, y, barWidth, height, barWidth / 2);
                    }
                };

                draw();
            }

            // Helper for rounded rectangles on canvas
            function roundRect(ctx, x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
                ctx.fill();
            }

            const formatTime = (secs) => {
                if(isNaN(secs)) return "0:00";
                const minutes = Math.floor(secs / 60);
                const seconds = Math.floor(secs % 60);
                return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }

            const updateSliderFill = (slider) => {
                if (!slider) return;
                const min = parseFloat(slider.min) || 0;
                const max = parseFloat(slider.max) || 100;
                const val = parseFloat(slider.value);
                const percentage = max > min ? (val - min) * 100 / (max - min) : 0;
                slider.style.backgroundSize = `${percentage}% 100%`;
            };

            // Initial State
            audio.volume = 1;
            updateSliderFill(volumeSlider);
            
            // Interaction Handler to Resume Audio Context
            const ensureAudioContext = () => {
                if (!audioCtx) {
                    initAudioContext();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            };

            // Play/Pause
            playPauseBtn.addEventListener('click', () => {
                ensureAudioContext();
                
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            audio.addEventListener('play', () => {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                ensureAudioContext();
            });

            audio.addEventListener('pause', () => {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            });
            
            audio.addEventListener('loadedmetadata', () => {
                durationElem.textContent = formatTime(audio.duration);
                seekSlider.max = Math.floor(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                if (!isSeeking) {
                    seekSlider.value = audio.currentTime;
                    currentTimeElem.textContent = formatTime(audio.currentTime);
                    updateSliderFill(seekSlider);
                }
            });

            audio.addEventListener('ended', () => {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                seekSlider.value = 0;
                updateSliderFill(seekSlider);
                currentTimeElem.textContent = "0:00";
            });

            // Seek
            seekSlider.addEventListener('input', (e) => {
                isSeeking = true;
                currentTimeElem.textContent = formatTime(seekSlider.value);
                updateSliderFill(seekSlider);
            });

            seekSlider.addEventListener('change', () => {
                audio.currentTime = seekSlider.value;
                isSeeking = false;
            });

            // Volume
            if(volumeSlider) {
                volumeSlider.addEventListener('input', (e) => {
                    audio.volume = e.target.value;
                    if(audio.volume === 0) {
                        muteBtn.classList.add('opacity-50');
                    } else {
                        muteBtn.classList.remove('opacity-50');
                    }
                    updateSliderFill(volumeSlider);
                });
            }
            
            if(muteBtn) {
                muteBtn.addEventListener('click', () => {
                    ensureAudioContext();
                    if (audio.volume > 0) {
                        lastVolume = audio.volume;
                        audio.volume = 0;
                        volumeSlider.value = 0;
                        muteBtn.classList.add('opacity-50');
                    } else {
                        audio.volume = lastVolume || 1;
                        volumeSlider.value = audio.volume;
                        muteBtn.classList.remove('opacity-50');
                    }
                    updateSliderFill(volumeSlider);
                });
            }

            // Handle Autoplay logic check
            if (!audio.paused) {
                 iconPlay.classList.add('hidden');
                 iconPause.classList.remove('hidden');
                 // Attempt to init context immediately if autoplay is working
                 // (Browsers might block this, but it doesn't hurt to try)
                 try {
                    ensureAudioContext();
                 } catch(e) {}
            }

            // Media Session API Support
            if ('mediaSession' in navigator) {
                let title = "{{ recording.composition_title }}";
                {% if let Some(mov) = recording.movement_title %}
                title += " - {{ mov }}";
                {% endif %}

                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: "{{ recording.artist_handle }}",
                });

                navigator.mediaSession.setActionHandler('play', () => {
                    audio.play();
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    audio.pause();
                });
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.seekTime !== undefined && !isNaN(details.seekTime)) {
                        audio.currentTime = details.seekTime;
                    }
                });

                const updatePositionState = () => {
                    if ('setPositionState' in navigator.mediaSession && !isNaN(audio.duration)) {
                        navigator.mediaSession.setPositionState({
                            duration: audio.duration,
                            playbackRate: audio.playbackRate,
                            position: audio.currentTime
                        });
                    }
                };

                audio.addEventListener('play', () => {
                    navigator.mediaSession.playbackState = 'playing';
                    updatePositionState();
                });

                audio.addEventListener('pause', () => {
                    navigator.mediaSession.playbackState = 'paused';
                });

                audio.addEventListener('ended', () => {
                    navigator.mediaSession.playbackState = 'none';
                });

                audio.addEventListener('loadedmetadata', updatePositionState);
                audio.addEventListener('ratechange', updatePositionState);
                audio.addEventListener('seeked', updatePositionState);
            }

        })();
    </script>
</div>
