<div
  id="player-container"
  class="sticky bottom-0 w-full z-40 border-t border-sonata-border/30 bg-sonata-charcoal pb-[env(safe-area-inset-bottom)]"
  data-composer-family-name="{{ recording.composer_family_name }}"
  data-composition-title="{{ recording.composition_title }}"
  {% if let Some(title) = recording.movement_title %}
    data-movement-title="{{ title }}"
  {% endif %}
  data-artist-handle="{{ recording.artist_handle }}"
  data-slug-id="{{ recording.slug_id }}"
>
  <div
    class="bg-sonata-charcoal border-t border-sonata-border py-2 px-4 lg:py-3 lg:px-6 flex flex-col lg:flex-row items-center justify-between shadow-2xl"
  >
    <style>
      /* Custom Range Slider Styling */
      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        border-radius: 2px;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #e8e8e8;
        margin-top: -5px;
        cursor: pointer;
        box-shadow: 0 0 0 0 rgba(232, 232, 232, 0);
        transition: box-shadow 0.2s ease;
      }

      input[type="range"]:hover::-webkit-slider-thumb {
        box-shadow: 0 0 0 6px rgba(232, 232, 232, 0.15);
      }

      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      /* Firefox */
      input[type="range"]::-moz-range-thumb {
        height: 14px;
        width: 14px;
        border: none;
        border-radius: 50%;
        background: #e8e8e8;
        cursor: pointer;
        box-shadow: 0 0 0 0 rgba(232, 232, 232, 0);
        transition: box-shadow 0.2s ease;
      }
      input[type="range"]:hover::-moz-range-thumb {
        box-shadow: 0 0 0 6px rgba(232, 232, 232, 0.15);
      }

      input[type="range"]::-moz-range-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }
    </style>

    <div
      class="w-full lg:w-1/4 flex justify-between lg:justify-start items-center mb-2 lg:mb-0 min-w-0"
    >
      <div class="flex items-center space-x-4 overflow-hidden">
        <div class="overflow-hidden">
          <div
            class="text-[9px] uppercase tracking-[0.15em] text-sonata-slate mb-0"
          >
            {{ recording.composer_family_name }}
          </div>
          <h3
            id="player-composition"
            class="text-xs lg:text-sm font-light tracking-wide text-sonata-pearl line-clamp-1"
          >
            {{ recording.composition_title }}
          </h3>
          <div class="flex items-center gap-2">
            <p
              class="text-[10px] uppercase tracking-[0.1em] text-sonata-slate line-clamp-1"
            >
              <span
                id="player-movement-container"
                class="{% if recording.movement_title.is_none() %}hidden{% endif %}"
              >
                <span id="player-movement">
                  {% if let Some(title) = recording.movement_title %}{{ title }}{% endif %}
                </span>
                —
              </span>
              <a
                id="player-artist"
                href="/{{ recording.artist_handle }}"
                hx-boost="true"
                hx-target="#main-content"
                class="hover:text-sonata-pearl transition-colors"
              >
                {{ recording.artist_handle }}
              </a>
            </p>
            <span
              id="player-loading"
              class="hidden text-[7px] uppercase tracking-widest text-sonata-slate animate-pulse bg-sonata-border px-1 py-0 rounded-sm"
              >Loading</span
            >
            <span
              id="player-error"
              class="hidden text-[7px] uppercase tracking-widest text-red-400 animate-pulse bg-red-900/20 px-1 py-0 rounded-sm"
              >Error</span
            >
          </div>
        </div>
      </div>

      <!-- Mobile Close Button -->
      <button
        onclick="closePlayer()"
        class="lg:hidden text-sonata-slate hover:text-sonata-pearl transition-colors ml-4 flex-shrink-0"
      >
        <div class="w-5 h-5 stroke-1">{% include "icons/close.svg" %}</div>
      </button>
    </div>

    <div class="w-full lg:flex-1 flex flex-col justify-center px-4 lg:px-8">
      <audio
        id="audio-player"
        src="/audio/{{ recording.file_key }}"
        type="{{ recording.mime_type }}"
        preload="auto"
        autoplay
      ></audio>

      <div class="flex items-center gap-4 lg:gap-6">
        <!-- Play/Pause -->
        <button
          id="play-pause-btn"
          class="text-sonata-pearl hover:text-sonata-highlight transition-all focus:outline-none flex-shrink-0 border border-sonata-pearl/20 rounded-full p-2 hover:border-sonata-highlight/50"
        >
          <div
            id="icon-play"
            class="w-5 h-5 hidden transform translate-x-[1px]"
          >
            {% include "icons/play.svg" %}
          </div>
          <div id="icon-pause" class="w-5 h-5">
            {% include "icons/pause.svg" %}
          </div>
        </button>
        <!-- Time & Progress -->
        <div class="flex-1 flex items-center gap-3 min-w-0">
          <span
            id="current-time"
            class="text-[10px] text-sonata-slate font-mono w-8 lg:w-10 text-right flex-shrink-0"
            >0:00</span
          >

          <div class="relative flex-1 h-6 flex items-center group">
            <input
              type="range"
              id="seek-slider"
              class="w-full h-1 appearance-none focus:outline-none z-10 cursor-pointer"
              style="background-image: linear-gradient(#e8e8e8, #e8e8e8); background-size: 0% 100%; background-repeat: no-repeat;"
              min="0"
              value="0"
              step="0.1"
            />
          </div>

          <span
            id="duration"
            class="text-[10px] text-sonata-slate font-mono w-8 lg:w-10 flex-shrink-0"
            >--:--</span
          >
        </div>
      </div>
    </div>
    <!-- Extra: Volume + Desktop Close -->
    <div class="hidden lg:flex lg:w-1/4 items-center justify-end gap-6">
      <!-- Volume -->
      <div class="flex items-center gap-2 group flex-shrink-0">
        <button
          id="mute-btn"
          class="text-sonata-slate hover:text-sonata-pearl transition-colors"
        >
          <div class="w-5 h-5">{% include "icons/volume.svg" %}</div>
        </button>
        <div class="w-16 lg:w-20 flex items-center h-6">
          <input
            type="range"
            id="volume-slider"
            class="w-full h-1 appearance-none focus:outline-none cursor-pointer"
            style="background-image: linear-gradient(#e8e8e8, #e8e8e8); background-size: 100% 100%; background-repeat: no-repeat;"
            min="0"
            max="1"
            step="0.05"
            value="1"
          />
        </div>
      </div>

      <!-- Desktop Close Button -->
      <button
        onclick="closePlayer()"
        class="text-sonata-slate hover:text-sonata-pearl transition-colors"
      >
        <div class="w-5 h-5 stroke-1">{% include "icons/close.svg" %}</div>
      </button>
    </div>

    <script>
      (function () {
        const audio = document.getElementById("audio-player");
        const playPauseBtn = document.getElementById("play-pause-btn");
        const iconPlay = document.getElementById("icon-play");
        const iconPause = document.getElementById("icon-pause");
        const seekSlider = document.getElementById("seek-slider");
        const volumeSlider = document.getElementById("volume-slider");
        const currentTimeElem = document.getElementById("current-time");
        const durationElem = document.getElementById("duration");
        const muteBtn = document.getElementById("mute-btn");
        const playerContainer = document.getElementById("player-container");
        const loadingIndicator = document.getElementById("player-loading");
        const errorIndicator = document.getElementById("player-error");

        let isSeeking = false;
        let lastVolume = 1;

        window.closePlayer = function () {
          if (audio) {
            audio.pause();
            audio.currentTime = 0;
          }
          const container = document.getElementById("player-container");
          if (container) {
            container.outerHTML = '<div id="player-container"></div>';
          }
        };

        const formatTime = (secs) => {
          if (isNaN(secs)) return "0:00";
          const minutes = Math.floor(secs / 60);
          const seconds = Math.floor(secs % 60);
          return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        };

        const updateSliderFill = (slider) => {
          if (!slider) return;
          const min = parseFloat(slider.min) || 0;
          const max = parseFloat(slider.max) || 100;
          const val = parseFloat(slider.value);
          const percentage = max > min ? ((val - min) * 100) / (max - min) : 0;
          slider.style.backgroundSize = `${percentage}% 100%`;
        };

        // Initial State
        audio.volume = 1;
        updateSliderFill(volumeSlider);

        playPauseBtn.addEventListener("click", () => {
          if (audio.paused) {
            audio.play();
          } else {
            audio.pause();
          }
        });

        audio.addEventListener("play", () => {
          iconPlay.classList.add("hidden");
          iconPause.classList.remove("hidden");

          if ("mediaSession" in navigator) {
            navigator.mediaSession.playbackState = "playing";
          }
        });

        audio.addEventListener("pause", () => {
          iconPlay.classList.remove("hidden");
          iconPause.classList.add("hidden");
          if ("mediaSession" in navigator) {
            navigator.mediaSession.playbackState = "paused";
          }
        });

        audio.addEventListener("loadedmetadata", () => {
          durationElem.textContent = formatTime(audio.duration);
          seekSlider.max = Math.floor(audio.duration);
          updatePositionState();
        });

        let lastFormattedTime = "";

        // Update UI when tab becomes visible
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && audio && !isNaN(audio.currentTime)) {
            seekSlider.value = audio.currentTime;
            const timeStr = formatTime(audio.currentTime);
            if (timeStr !== lastFormattedTime) {
              currentTimeElem.textContent = timeStr;
              lastFormattedTime = timeStr;
            }
            updateSliderFill(seekSlider);
          }
        });

        audio.addEventListener("timeupdate", () => {
          if (!isSeeking) {
            // Skip UI updates if the tab is hidden to save battery
            if (document.hidden) return;

            seekSlider.value = audio.currentTime;

            const timeStr = formatTime(audio.currentTime);
            // Only update DOM if text actually changed
            if (timeStr !== lastFormattedTime) {
              currentTimeElem.textContent = timeStr;
              lastFormattedTime = timeStr;
            }

            updateSliderFill(seekSlider);
          }
        });

        audio.addEventListener("ended", () => {
          iconPlay.classList.remove("hidden");
          iconPause.classList.add("hidden");
          seekSlider.value = 0;
          updateSliderFill(seekSlider);
          currentTimeElem.textContent = "0:00";
          if ("mediaSession" in navigator) {
            navigator.mediaSession.playbackState = "none";
          }
        });

        seekSlider.addEventListener("input", (e) => {
          isSeeking = true;
          currentTimeElem.textContent = formatTime(seekSlider.value);
          updateSliderFill(seekSlider);
        });

        seekSlider.addEventListener("change", () => {
          audio.currentTime = seekSlider.value;
          isSeeking = false;
        });

        if (volumeSlider) {
          volumeSlider.addEventListener("input", (e) => {
            audio.volume = e.target.value;
            if (audio.volume === 0) {
              muteBtn.classList.add("opacity-50");
            } else {
              muteBtn.classList.remove("opacity-50");
            }
            updateSliderFill(volumeSlider);
          });
        }

        if (muteBtn) {
          muteBtn.addEventListener("click", () => {
            if (audio.volume > 0) {
              lastVolume = audio.volume;
              audio.volume = 0;
              volumeSlider.value = 0;
              muteBtn.classList.add("opacity-50");
            } else {
              audio.volume = lastVolume || 1;
              volumeSlider.value = audio.volume;
              muteBtn.classList.remove("opacity-50");
            }
            updateSliderFill(volumeSlider);
          });
        }

        // Media Session Action Handlers
        if ("mediaSession" in navigator) {
          const ds = playerContainer.dataset;
          let title = ds.composerFamilyName + ": " + ds.compositionTitle;
          if (ds.movementTitle) {
            title += " - " + ds.movementTitle;
          }

          navigator.mediaSession.metadata = new MediaMetadata({
            title: title,
            artist: ds.artistHandle,
          });

          navigator.mediaSession.setActionHandler("play", () => audio.play());
          navigator.mediaSession.setActionHandler("pause", () => audio.pause());
          navigator.mediaSession.setActionHandler("seekto", (details) => {
            if (details.seekTime !== undefined && !isNaN(details.seekTime)) {
              audio.currentTime = details.seekTime;
            }
          });
        }

        const updatePositionState = () => {
          if (
            "mediaSession" in navigator &&
            "setPositionState" in navigator.mediaSession &&
            !isNaN(audio.duration)
          ) {
            navigator.mediaSession.setPositionState({
              duration: audio.duration,
              playbackRate: audio.playbackRate,
              position: audio.currentTime,
            });
          }
        };

        audio.addEventListener("loadedmetadata", updatePositionState);
        audio.addEventListener("ratechange", updatePositionState);
        audio.addEventListener("seeked", updatePositionState);
        audio.addEventListener("play", updatePositionState);

        // Loading State Handlers
        audio.addEventListener("loadstart", () => {
          loadingIndicator.classList.remove("hidden");
          errorIndicator.classList.add("hidden");
        });

        audio.addEventListener("waiting", () => {
          loadingIndicator.classList.remove("hidden");
        });

        audio.addEventListener("canplay", () => {
          loadingIndicator.classList.add("hidden");
          errorIndicator.classList.add("hidden");
        });

        audio.addEventListener("playing", () => {
          loadingIndicator.classList.add("hidden");
          errorIndicator.classList.add("hidden");
        });

        audio.addEventListener("error", () => {
          loadingIndicator.classList.add("hidden");
          errorIndicator.classList.remove("hidden");
        });

        const updateExternal = () => {
          if (window.updatePlayButtonsState) window.updatePlayButtonsState();
        };
        audio.addEventListener("play", updateExternal);
        audio.addEventListener("pause", updateExternal);
        audio.addEventListener("ended", updateExternal);
        audio.addEventListener("loadedmetadata", updateExternal);
        updateExternal();
      })();
    </script>
  </div>
</div>
