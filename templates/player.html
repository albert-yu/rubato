<div class="bg-atelier-panel/95 backdrop-blur border-t border-atelier-border shadow-lg p-4 flex items-center justify-between">
    <div class="flex items-center space-x-4">
        <div class="bg-atelier-bg p-2 rounded shadow-sm border border-atelier-border">
            <svg class="w-6 h-6 text-atelier-ink" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-6v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-6c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"></path></svg>
        </div>
        <div>
            <h3 class="text-sm font-bold font-serif text-atelier-text tracking-wide">{{ recording.composition_title }}</h3>
            <p class="text-xs text-atelier-muted">
                {% if let Some(title) = recording.movement_title %}
                    {{ title }} - 
                {% endif %}
                {{ recording.artist_handle }}
            </p>
        </div>
    </div>
    
    <div class="flex-1 max-w-2xl mx-8">
        <audio controls autoplay class="w-full" src="/audio/{{ recording.file_key }}" type="{{ recording.mime_type }}">
            Your browser does not support the audio element.
        </audio>
    </div>
    
    <div>
        <button onclick="document.getElementById('player-container').innerHTML=''" class="text-atelier-muted hover:text-atelier-ink transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
</div>
