<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-4 flex items-center justify-between z-50">
    <div class="flex items-center space-x-4">
        <div class="bg-indigo-100 p-2 rounded">
            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-6v13"></path></svg>
        </div>
        <div>
            <h3 class="text-sm font-bold text-gray-900">{{ recording.composition_title }}</h3>
            <p class="text-xs text-gray-500">
                {% if let Some(title) = recording.movement_title %}
                    {{ title }} - 
                {% endif %}
                {{ recording.artist_handle }}
            </p>
        </div>
    </div>
    
    <div class="flex-1 max-w-2xl mx-8">
        <audio controls autoplay class="w-full">
            <source src="/audio/{{ recording.file_key }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>
    
    <div>
        <button onclick="document.getElementById('player-container').innerHTML=''" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
</div>
