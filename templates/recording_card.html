<div
  class="sonata-card sonata-card-interactive group relative cursor-pointer"
  data-composition-title="{{ recording.composition_title }}"
  {% if let Some(title) = recording.movement_title %}
    data-movement-title="{{ title }}"
  {% endif %}
  data-artist-handle="{{ recording.artist_handle }}"
  data-file-key="{{ recording.file_key }}"
  data-mime-type="{{ recording.mime_type }}"
  onclick="if (!event.target.closest('a')) playRecording(this.dataset)"
>
  <div
    class="mb-8 text-[10px] tracking-widest text-sonata-slate uppercase font-light"
  >
    {{ recording.created_at.format("%m.%d.%Y") }}
  </div>

  <h3
    class="text-xl font-light tracking-tight text-sonata-pearl mb-2 group-hover:text-white transition-colors"
  >
    <a
      href="/{{ recording.artist_handle }}/recordings/{{ recording.slug_id }}"
      hx-boost="true"
      hx-target="#main-content"
      class="hover:underline decoration-sonata-slate underline-offset-4"
    >
      {{ recording.composition_title }}
    </a>
  </h3>

  {% if let Some(title) = recording.movement_title %}
    <div class="font-light text-sonata-slate mb-4">{{ title }}</div>
  {% endif %}

  <div class="mt-12 flex justify-between items-center">
    <a
      href="/{{ recording.artist_handle }}"
      hx-boost="true"
      hx-target="#main-content"
      class="text-xs tracking-widest uppercase font-light text-sonata-slate hover:text-sonata-pearl transition-colors relative z-10"
      >@{{ recording.artist_handle }}</a
    >

    <div
      class="w-10 h-10 flex items-center justify-center rounded-full border border-sonata-border group-hover:bg-sonata-pearl group-hover:text-sonata-black transition-all opacity-100 md:opacity-0 md:group-hover:opacity-100"
    >
      <div class="w-4 h-4">{% include "icons/play.svg" %}</div>
    </div>
  </div>

  {% if let Some(notes) = recording.notes %}
    <div
      class="mt-6 pt-6 border-t border-sonata-border/50 text-[11px] text-sonata-slate font-light leading-relaxed line-clamp-2"
    >
      {{ notes }}
    </div>
  {% endif %}
</div>
