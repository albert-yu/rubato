<div class="max-w-4xl mx-auto py-12">
  <div class="mb-12">
    <a
      href="/{{ recording.artist_handle }}/recordings/{{ recording.slug_id }}"
      class="text-xs tracking-[0.3em] uppercase font-light text-sonata-slate hover:text-sonata-pearl transition-colors"
    >
      &larr; Back to Recording
    </a>
    <h1 class="text-4xl font-light tracking-tight text-sonata-pearl mt-4 mb-2">
      Edit Notes
    </h1>
    <p class="text-sonata-slate font-light">
      {{ recording.composer_family_name }}: {{ recording.composition_title }}
    </p>
  </div>

  <form
    action="/{{ recording.artist_handle }}/recordings/{{ recording.slug_id }}/edit"
    method="post"
    hx-boost="true"
    hx-target="#main-content"
    class="space-y-8"
  >
    <div>
      <label
        for="notes"
        class="block text-xs uppercase tracking-widest font-light text-sonata-slate mb-2"
        >Notes</label
      >
      <textarea
        id="notes"
        name="notes"
        rows="10"
        class="w-full bg-sonata-black border border-sonata-charcoal text-sonata-pearl p-4 focus:border-sonata-pearl focus:outline-none transition-colors font-light leading-relaxed resize-y"
      >
{% if let Some(notes) = recording.notes %}{{ notes }}{% endif %}</textarea
      >
      <p class="mt-2 text-[10px] text-sonata-slate font-light">
        Share your thoughts, interpretation details, or technical notes about
        this recording.
      </p>
    </div>

    <div>
      <label
        for="visibility"
        class="block text-xs uppercase tracking-widest font-light text-sonata-slate mb-2"
        >Visibility</label
      >
      <div class="relative">
        <select
          name="visibility"
          id="visibility"
          class="block w-full appearance-none bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light uppercase tracking-widest cursor-pointer"
        >
          <option
            value="public"
            {% if recording.visibility == Visibility::Public %}selected{% endif %}
          >
            Public
          </option>
          <option
            value="unlisted"
            {% if recording.visibility == Visibility::Unlisted %}selected{% endif %}
          >
            Unlisted
          </option>
          <option
            value="private"
            {% if recording.visibility == Visibility::Private %}selected{% endif %}
          >
            Private
          </option>
        </select>
        <div
          class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-sonata-slate"
        >
          <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20">
            <path
              d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"
            />
          </svg>
        </div>
      </div>
    </div>

    <div
      class="flex justify-between items-center mt-12 border-t border-sonata-charcoal pt-8"
    >
      <button
        type="button"
        hx-delete="/{{ recording.artist_handle }}/recordings/{{ recording.slug_id }}/edit"
        hx-confirm="Are you sure you want to delete this recording? This action cannot be undone."
        hx-target="body"
        hx-push-url="true"
        class="text-red-900/70 hover:text-red-500 text-[10px] uppercase tracking-widest transition-colors"
      >
        Delete Recording
      </button>
      <div class="flex gap-4">
        <a
          href="/{{ recording.artist_handle }}/recordings/{{ recording.slug_id }}"
          class="sonata-btn-secondary px-6 py-3 text-xs"
          >Cancel</a
        >
        <button type="submit" class="sonata-btn px-8 py-3 text-xs">
          Save Changes
        </button>
      </div>
    </div>
  </form>
</div>
