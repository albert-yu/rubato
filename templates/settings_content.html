<div class="max-w-2xl mx-auto py-12">
    <div class="mb-12">
        <h1 class="text-3xl font-light tracking-tighter text-sonata-pearl mb-2">Settings</h1>
        <div class="w-12 h-[1px] bg-sonata-charcoal"></div>
    </div>

    <div class="sonata-card space-y-12">
        <div class="border-b border-sonata-border/30 pb-12">
            <h2 class="text-[10px] uppercase tracking-[0.2em] font-light text-sonata-slate mb-8">Account Information</h2>
            <div class="grid grid-cols-1 gap-8">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-1">Email Address</label>
                    <p class="text-sm font-light text-sonata-pearl">{{ current_user.as_ref().unwrap().email }}</p>
                </div>
                {% if current_user.as_ref().unwrap().is_privileged() %}
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-1">Role</label>
                    <p class="text-sm font-light text-sonata-pearl">{{ current_user.as_ref().unwrap().role }}</p>
                </div>
                {% endif %}
            </div>
        </div>

        <div>
            <h2 class="text-[10px] uppercase tracking-[0.2em] font-light text-sonata-slate mb-8">Musician Profile</h2>
            <form action="/settings" method="post" class="space-y-6">
                <div>
                    <label for="handle" class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2">Handle</label>
                    <input type="text" name="handle" id="handle" value="{{ musician.handle }}" required class="block w-full bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="given_name" class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2">Given Name</label>
                        <input type="text" name="given_name" id="given_name" value="{{ musician.given_name }}" required class="block w-full bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light">
                    </div>
                    <div>
                        <label for="family_name" class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2">Family Name</label>
                        <input type="text" name="family_name" id="family_name" value="{{ musician.family_name }}" required class="block w-full bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="birth_date" class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2">Birth Date</label>
                        <input type="date" name="birth_date" id="birth_date" value="{% if let Some(date) = musician.birth_date %}{{ date }}{% endif %}" class="block w-full bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light [color-scheme:dark]">
                    </div>
                    <div>
                        <label for="death_date" class="block text-[10px] uppercase tracking-widest font-light text-sonata-slate mb-2">Death Date</label>
                        <input type="date" name="death_date" id="death_date" value="{% if let Some(date) = musician.death_date %}{{ date }}{% endif %}" class="block w-full bg-sonata-black border border-sonata-charcoal rounded-sm py-3 px-4 text-sonata-pearl focus:outline-none focus:border-sonata-slate transition-colors text-sm font-light [color-scheme:dark]">
                    </div>
                </div>
                <div class="pt-6">
                    <button type="submit" class="sonata-btn w-full">
                        Update Profile
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
