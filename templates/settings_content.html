
<h1 class="text-3xl font-bold mb-6">Settings</h1>
<div class="bg-white shadow rounded-lg p-6 max-w-2xl">
    <div class="mb-6 border-b pb-4">
        <h2 class="text-xl font-semibold mb-2">Account Info</h2>
        <div class="grid grid-cols-1 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-500">Email Address</label>
                <p class="mt-1 text-lg text-gray-900">{{ current_user.as_ref().unwrap().email }}</p>
            </div>
            {% if current_user.as_ref().unwrap().is_privileged() %}
            <div>
                <label class="block text-sm font-medium text-gray-500">Role</label>
                <p class="mt-1 text-lg text-gray-900">{{ current_user.as_ref().unwrap().role }}</p>
            </div>
            {% endif %}
        </div>
    </div>

    <div>
        <h2 class="text-xl font-semibold mb-4">Musician Profile</h2>
        <form action="/settings" method="post" class="space-y-4">
            <div>
                <label for="handle" class="block text-sm font-medium text-gray-700">Handle</label>
                <input type="text" name="handle" id="handle" value="{{ musician.handle }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="given_name" class="block text-sm font-medium text-gray-700">Given Name</label>
                    <input type="text" name="given_name" id="given_name" value="{{ musician.given_name }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="family_name" class="block text-sm font-medium text-gray-700">Family Name</label>
                    <input type="text" name="family_name" id="family_name" value="{{ musician.family_name }}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="birth_date" class="block text-sm font-medium text-gray-700">Birth Date</label>
                    <input type="date" name="birth_date" id="birth_date" value="{% if let Some(date) = musician.birth_date %}{{ date }}{% endif %}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="death_date" class="block text-sm font-medium text-gray-700">Death Date</label>
                    <input type="date" name="death_date" id="death_date" value="{% if let Some(date) = musician.death_date %}{{ date }}{% endif %}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                </div>
            </div>
            <div class="pt-4">
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
