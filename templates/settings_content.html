
<h1 class="text-3xl font-serif font-bold mb-6 text-black">Settings</h1>
<div class="bg-white border border-gray-200 p-8 max-w-2xl">
    <div class="mb-8 border-b border-gray-100 pb-6">
        <h2 class="text-xl font-bold mb-4 font-serif">Account Info</h2>
        <div class="grid grid-cols-1 gap-4">
            <div>
                <label class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Email Address</label>
                <p class="mt-1 text-lg text-gray-900 font-light">{{ current_user.as_ref().unwrap().email }}</p>
            </div>
            {% if current_user.as_ref().unwrap().is_privileged() %}
            <div>
                <label class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Role</label>
                <p class="mt-1 text-lg text-gray-900 font-light">{{ current_user.as_ref().unwrap().role }}</p>
            </div>
            {% endif %}
        </div>
    </div>

    <div>
        <h2 class="text-xl font-bold mb-6 font-serif">Musician Profile</h2>
        <form action="/settings" method="post" class="space-y-6">
            <div>
                <label for="handle" class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Handle</label>
                <input type="text" name="handle" id="handle" value="{{ musician.handle }}" required class="mt-2 block w-full rounded-none border-gray-300 shadow-sm focus:border-black focus:ring-black">
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="given_name" class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Given Name</label>
                    <input type="text" name="given_name" id="given_name" value="{{ musician.given_name }}" required class="mt-2 block w-full rounded-none border-gray-300 shadow-sm focus:border-black focus:ring-black">
                </div>
                <div>
                    <label for="family_name" class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Family Name</label>
                    <input type="text" name="family_name" id="family_name" value="{{ musician.family_name }}" required class="mt-2 block w-full rounded-none border-gray-300 shadow-sm focus:border-black focus:ring-black">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label for="birth_date" class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Birth Date</label>
                    <input type="date" name="birth_date" id="birth_date" value="{% if let Some(date) = musician.birth_date %}{{ date }}{% endif %}" class="mt-2 block w-full rounded-none border-gray-300 shadow-sm focus:border-black focus:ring-black">
                </div>
                <div>
                    <label for="death_date" class="block text-xs font-mono font-medium text-gray-500 uppercase tracking-wider">Death Date</label>
                    <input type="date" name="death_date" id="death_date" value="{% if let Some(date) = musician.death_date %}{{ date }}{% endif %}" class="mt-2 block w-full rounded-none border-gray-300 shadow-sm focus:border-black focus:ring-black">
                </div>
            </div>
            <div class="pt-6">
                <button type="submit" class="bg-black text-white px-6 py-2 rounded-none hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 uppercase tracking-widest text-sm font-bold transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
