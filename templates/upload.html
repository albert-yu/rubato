{% extends "base.html" %}

{% block title %}Upload{% endblock %}

{% block nav %}
    {% include "nav.html" %}
{% endblock %}

{% block content %}
<div class="py-12">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">Upload Recording</h1>
    <div class="bg-white shadow rounded-lg p-6 max-w-2xl">
        {% if let Some(err) = error %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                {{ err }}
            </div>
        {% endif %}

        <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label for="composition_id" class="block text-sm font-medium text-gray-700">Composition</label>
                <select name="composition_id" id="composition_id" required class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
                    <option value="" disabled selected>Select a composition</option>
                    {% for comp in compositions %}
                        <option value="{{ comp.id }}">{{ comp.title }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="file" class="block text-sm font-medium text-gray-700">Audio File</label>
                <input type="file" name="file" id="file" accept="audio/*" required class="mt-1 block w-full text-sm text-gray-500
                  file:mr-4 file:py-2 file:px-4
                  file:rounded-md file:border-0
                  file:text-sm file:font-semibold
                  file:bg-indigo-50 file:text-indigo-700
                  hover:file:bg-indigo-100
                ">
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Upload
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
