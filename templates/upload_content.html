<div class="py-12">
    <h1 class="text-4xl font-serif font-bold text-white mb-8 tracking-tight">Upload <span class="text-nocturne-gold italic">Recording</span></h1>
    <div class="bg-nocturne-panel border border-white/5 shadow-2xl rounded-xl p-8 max-w-2xl">
        {% if let Some(err) = error %}
        <div class="bg-red-900/20 border border-red-900/50 text-red-400 px-4 py-3 rounded-lg mb-6 text-sm">
            {{ err }}
        </div>
        {% endif %}
        <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-8">
            {% include "composition_picker.html" %}
            <div>
                <label for="file" class="block text-sm font-medium text-nocturne-muted mb-2 uppercase tracking-widest">Audio File <span class="text-nocturne-gold">*</span></label>
                <input type="file" name="file" id="file" accept="audio/*" required class="mt-1 block w-full text-sm text-nocturne-muted
                  file:mr-4 file:py-2.5 file:px-6
                  file:rounded-full file:border-0
                  file:text-sm file:font-bold
                  file:bg-white/5 file:text-nocturne-gold
                  hover:file:bg-white/10 file:transition-colors
                ">
            </div>

            <div>
                <label for="notes" class="block text-sm font-medium text-nocturne-muted mb-2 uppercase tracking-widest">Notes</label>
                <textarea name="notes" id="notes" rows="4" class="mt-1 block w-full rounded-lg bg-nocturne-bg border-white/10 text-white shadow-sm focus:border-nocturne-gold focus:ring-nocturne-gold text-sm placeholder:text-nocturne-muted/30" placeholder="Optional: Add some notes about this recording..."></textarea>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-3 px-4 bg-nocturne-gold hover:bg-nocturne-gold-light text-nocturne-bg font-bold rounded-lg shadow-lg shadow-nocturne-gold/10 transition-all text-sm uppercase tracking-widest">
                    Complete Upload
                </button>
            </div>
        </form>
    </div>
</div>
