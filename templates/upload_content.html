<div class="py-12">
    <h1 class="text-4xl font-serif font-bold text-atelier-ink mb-8 tracking-tight">Upload <span class="text-atelier-muted italic">Recording</span></h1>
    <div class="bg-atelier-panel border border-atelier-border shadow-sm rounded-xl p-8 max-w-2xl">
        {% if let Some(err) = error %}
        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg mb-6 text-sm">
            {{ err }}
        </div>
        {% endif %}
        <form action="/upload" method="post" enctype="multipart/form-data" class="space-y-8">
            {% include "composition_picker.html" %}
            <div>
                <label for="file" class="block text-sm font-medium text-atelier-muted mb-2 uppercase tracking-widest">Audio File <span class="text-atelier-ink">*</span></label>
                <input type="file" name="file" id="file" accept="audio/*" required class="mt-1 block w-full text-sm text-atelier-muted
                  file:mr-4 file:py-2.5 file:px-6
                  file:rounded-full file:border-0
                  file:text-sm file:font-bold
                  file:bg-atelier-bg file:text-atelier-ink
                  file:border file:border-atelier-border
                  hover:file:bg-atelier-border/50 file:transition-colors
                ">
            </div>

            <div>
                <label for="notes" class="block text-sm font-medium text-atelier-muted mb-2 uppercase tracking-widest">Notes</label>
                <textarea name="notes" id="notes" rows="4" class="mt-1 block w-full rounded-lg bg-white border-atelier-border text-atelier-text shadow-sm focus:border-atelier-ink focus:ring-atelier-ink text-sm placeholder:text-atelier-muted/50" placeholder="Optional: Add some notes about this recording..."></textarea>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full flex justify-center py-3 px-4 bg-atelier-ink hover:bg-atelier-ink-light text-white font-bold rounded-lg shadow-md transition-all text-sm uppercase tracking-widest">
                    Complete Upload
                </button>
            </div>
        </form>
    </div>
</div>
